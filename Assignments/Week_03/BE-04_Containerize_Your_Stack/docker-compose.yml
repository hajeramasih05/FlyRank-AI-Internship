services:
  db:
    image: postgres:18.7
    container_name: be04-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - be04_postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: be04-fastapi
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  be04_postgres_data:
    external: true